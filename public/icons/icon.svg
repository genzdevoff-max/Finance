<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" fill-opacity="0.1" />
  <!-- Rupee Symbol -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Top horizontal bar -->
    <rect x="156" y="140" width="200" height="32" rx="16" />
    <!-- Second horizontal bar -->
    <rect x="156" y="200" width="160" height="32" rx="16" />
    <!-- Vertical stem -->
    <rect x="196" y="140" width="32" height="150" rx="16" />
    <!-- Loop arc -->
    <path d="M 220 172 C 320 172 320 268 220 268 Z" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />
    <!-- Diagonal leg -->
    <path d="M 210 260 L 330 380" stroke="#ffffff" stroke-width="34" stroke-linecap="round" />
  </g>
</svg>
